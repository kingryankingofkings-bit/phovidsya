name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    name: Python tests (3.11 / 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/ -v --tb=short
          coverage report --include="aegis_shield/*" --fail-under=85

  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned by rust-toolchain.toml (1.89.0); declaring it here keeps the
      # workflow honest about which toolchain actually runs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --locked

  shell-checks:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck deploy/install.sh

  docker-build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t aegis-shield:ci .

      - name: Smoke test the running container
        run: |
          docker run -d --name aegis-ci \
            -e AEGIS_API_KEY=ci-smoke-test-key \
            -p 127.0.0.1:8443:8443 aegis-shield:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8443/v1/health >/dev/null 2>&1; then
              echo "health OK"; break
            fi
            if [ "$i" -eq 30 ]; then
              echo "daemon never became healthy"; docker logs aegis-ci; exit 1
            fi
            sleep 2
          done
          # Authenticated route must work, and must reject a missing key.
          curl -fsS -H 'X-API-Key: ci-smoke-test-key' \
            http://127.0.0.1:8443/v1/status | tee /dev/stderr | grep -q '"state"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8443/v1/status)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          docker rm -f aegis-ci

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --strict
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
