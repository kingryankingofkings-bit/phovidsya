[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-shield"
version = "0.1.0"
description = "Hardware-grade ransomware isolation — software reference deployment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Upper bounds are pinned to the next major so a future release cannot silently
# change behaviour in a security control. Raise them deliberately, with tests.
dependencies = [
    "cryptography>=42,<51",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "click>=8.1,<9",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
aegis-shield = "aegis_shield.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    # Test-only: the FastAPI TestClient needs it. Not a runtime dependency.
    "httpx>=0.27,<1",
    "anyio",
    "coverage[toml]>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["aegis_shield"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
