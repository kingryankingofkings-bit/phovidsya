[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-shield"
version = "0.1.0"
description = "Hardware-grade ransomware isolation — software reference deployment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "click>=8.1",
    "pydantic>=2",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
aegis-shield = "aegis_shield.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio",
]

[tool.hatch.build.targets.wheel]
packages = ["aegis_shield"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
