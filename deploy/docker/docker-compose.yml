services:
  aegis-shield:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: aegis-shield:latest
    container_name: aegis-shield
    restart: unless-stopped
    ports:
      # Loopback only: the API has no TLS, so the key would otherwise cross the
      # network in cleartext. Terminate TLS in a reverse proxy to expose it.
      - "127.0.0.1:8443:8443"
    volumes:
      - aegis-namespace:/var/lib/aegis-shield
      - aegis-keys:/etc/aegis-shield
    environment:
      # No default. A known-value fallback would ship a public credential.
      AEGIS_API_KEY: "${AEGIS_API_KEY:?AEGIS_API_KEY must be set, e.g. export AEGIS_API_KEY=$(python3 -c 'import secrets;print(secrets.token_hex(32))')}"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8443/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aegis-namespace:
    driver: local
  aegis-keys:
    driver: local
